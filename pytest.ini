[pytest]
testpaths = tests
addopts = -q --tb=short
# Modo automatico: no hace falta marcar cada prueba async.
asyncio_mode = auto
# El bucle de eventos se comparte en toda la sesion, y no es un detalle: el
# pool de asyncpg es un global del modulo y queda atado al primer bucle que lo
# crea. Con un bucle por prueba, la primera funciona y todas las demas fallan
# con "Event loop is closed" -- que parece un fallo del codigo y es del arnes.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
