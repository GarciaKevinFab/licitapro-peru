[pytest]
testpaths = tests
addopts = -q --tb=short
# La raiz del proyecto en sys.path, o `import shared` no resuelve.
#
#   Funcionaba por accidente: `python -m pytest` mete el directorio actual en
#   sys.path, asi que desde la raiz del proyecto todo importaba. El CI llama a
#   `pytest` pelado, que NO lo hace, y ahi la suite entera no llegaba ni a
#   cargar el conftest:
#
#     ModuleNotFoundError: No module named 'shared'
#
#   Declararlo aqui lo arregla para las dos formas de invocarlo, que es mejor
#   que exigir que todo el mundo recuerde la larga.
pythonpath = .
# Modo automatico: no hace falta marcar cada prueba async.
asyncio_mode = auto
# El bucle de eventos se comparte en toda la sesion, y no es un detalle: el
# pool de asyncpg es un global del modulo y queda atado al primer bucle que lo
# crea. Con un bucle por prueba, la primera funciona y todas las demas fallan
# con "Event loop is closed" -- que parece un fallo del codigo y es del arnes.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
