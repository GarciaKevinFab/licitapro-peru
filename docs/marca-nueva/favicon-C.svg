<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LicitaPro">
  <!-- OPCION C: la B, pero con la marca CENTRADA y mas grande.
       En A y B el simbolo vive en la mitad derecha y la izquierda queda vacia.
       A 512 px eso es composicion; a 16 px es desperdiciar la mitad de los
       pixeles que tienes. Aqui el anillo ocupa el tile y los puntos del ruido
       se reducen a tres, porque seis a 16 px son suciedad, no ruido. -->
  <rect width="64" height="64" rx="14" fill="#0A0D12"/>
  <g fill="#2B7C6A">
    <circle cx="12.5" cy="13.5" r="2.2"/>
    <circle cx="52.5" cy="15.0" r="1.9"/>
    <circle cx="13.5" cy="50.5" r="2.0"/>
  </g>
  <circle cx="32" cy="32" r="6.4" fill="#34E0B4"/>
  <circle cx="32" cy="32" r="15.2" fill="none" stroke="#34E0B4"
          stroke-width="3.4" stroke-linecap="round"
          stroke-dasharray="80 15.5" transform="rotate(-108 32 32)"/>
</svg>
