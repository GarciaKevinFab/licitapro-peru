<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}LicitaPro Perú{% endblock %}</title>
{# Un solo SVG sirve de favicon en claro y en oscuro, y escala a cualquier
   tamano. No hacen falta los seis PNG de siempre. #}
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style nonce="{{ request.state.csp_nonce }}">
:root{
  --bg:#F7F9FA; --panel:#FFFFFF; --panel-2:#EEF2F4;
  --ink:#12181C; --ink-2:#46555E; --ink-3:#7A8A93;
  --line:#DCE3E7; --line-soft:#E8EDF0;
  --ac:#0F7A63; --ac-soft:#E2F1EC;
  --urg:#B3261E; --urg-soft:#F9E4E2;
  --warn:#8A5A00; --warn-soft:#F7EEDC;
  --ok:#2F6B3F; --ok-soft:#E1EDE4;
  --btn-txt:#FFFFFF;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1216; --panel:#151C21; --panel-2:#1C252B;
    --ink:#E7EEF1; --ink-2:#AFBEC6; --ink-3:#78888F;
    --line:#27333A; --line-soft:#1F2A30;
    --ac:#4ECBA8; --ac-soft:#123029;
    --urg:#F08B82; --urg-soft:#3A1F1D;
    --warn:#E0B45C; --warn-soft:#332714;
    --ok:#7FC08E; --ok-soft:#1A2E20;
    --btn-txt:#06211B;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1216; --panel:#151C21; --panel-2:#1C252B;
  --ink:#E7EEF1; --ink-2:#AFBEC6; --ink-3:#78888F;
  --line:#27333A; --line-soft:#1F2A30;
  --ac:#4ECBA8; --ac-soft:#123029;
  --urg:#F08B82; --urg-soft:#3A1F1D;
  --warn:#E0B45C; --warn-soft:#332714;
  --ok:#7FC08E; --ok-soft:#1A2E20;
  --btn-txt:#06211B;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14.5px;line-height:1.5}
.mono,.num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
a{color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:3px}

/* ---------- CABECERA DE LA APLICACION ----------
   QUE ESTABA MAL: los tres bloques (marca, menu de siete enlaces, sesion) se
   tocaban sin separacion, la pagina activa se distinguia solo por un cambio de
   color que se pierde de un vistazo, y la sesion era un amasijo de texto
   suelto, insignias y un boton. Parecia una barra de depuracion.

   QUE SE HACE AHORA: pegajosa con desenfoque -- el contenido pasa por debajo
   en vez de empujarla --, tres zonas con separadores reales, y la pagina
   activa marcada con una barra bajo el texto ADEMAS del color. Fiarlo todo al
   color falla con quien no distingue verdes, que es mas gente de la que
   parece. */
header{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--panel) 82%, transparent);
  backdrop-filter:blur(16px) saturate(150%);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
  border-bottom:1px solid var(--line);
  padding:0 22px;
  display:flex;align-items:center;gap:22px;flex-wrap:wrap;
}
.brand{font-family:Sora,sans-serif;font-weight:600;font-size:15px;letter-spacing:-.022em;
  display:flex;align-items:center;gap:9px;color:var(--ink);text-decoration:none;
  padding-block:13px;margin-right:4px}
.brand .ico{width:19px;height:19px;color:var(--ac);flex:none}
.brand .pe{color:var(--ink-3);font-weight:400}

nav.menu{display:flex;align-items:center;gap:2px;font-size:13.5px;flex:1;flex-wrap:wrap}
nav.menu a{
  color:var(--ink-2);text-decoration:none;position:relative;
  padding:15px 11px;transition:color .2s ease;
}
nav.menu a:hover{color:var(--ink)}
nav.menu a.activo{color:var(--ac);font-weight:500}
/* La barra inferior es la senal principal; el color, la secundaria. */
nav.menu a.activo::after{
  content:"";position:absolute;left:11px;right:11px;bottom:-1px;height:2px;
  background:var(--ac);border-radius:2px 2px 0 0;
}

.sesion{display:flex;align-items:center;gap:11px;font-size:12.5px;color:var(--ink-3);
  padding-block:10px;padding-left:20px;border-left:1px solid var(--line)}
/* Inicial en un circulo: ancla la mirada y ocupa mucho menos que el correo
   entero, que en pantallas medianas partia la barra en dos lineas. */
.sesion .yo{
  width:27px;height:27px;border-radius:50%;flex:none;
  background:var(--ac-soft);color:var(--ac);
  display:flex;align-items:center;justify-content:center;
  font-family:Sora,sans-serif;font-weight:600;font-size:12px;text-transform:uppercase;
}
.sesion .quien{max-width:17ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:900px){ .sesion .quien{display:none} }
.sesion button.sec{padding:6px 12px;font-size:12.5px}

main{max-width:1400px;margin:0 auto;padding:26px 22px 72px}

button,.btn{background:var(--ac);color:var(--btn-txt);border:none;border-radius:4px;
  padding:8px 16px;font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;
  text-decoration:none;display:inline-block}
button.sec,.btn.sec{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
button.peligro{background:transparent;color:var(--urg);border:1px solid var(--line)}
input[type=text],input[type=email],input[type=password],input[type=search],
input[type=number],select,textarea{
  background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;
  padding:8px 10px;font:inherit;font-size:13.5px;width:100%}
textarea{min-height:74px;resize:vertical;line-height:1.45}
label.campo{display:flex;flex-direction:column;gap:5px}
label.campo>span{font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500}
.ayuda{font-size:12px;color:var(--ink-3);margin:4px 0 0}

.mensaje{border-radius:5px;padding:11px 15px;margin-bottom:16px;font-size:13.5px}
.mensaje.ok{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok)}
.mensaje.mal{background:var(--urg-soft);color:var(--urg);border:1px solid var(--urg)}
/* La tipografia se repite aqui porque `.aviso` son DOS cosas con el mismo
   nombre: la insignia del menu (mono, mayusculas, 10px) y el color de este
   cuadro de mensaje. Las dos reglas pesan igual -- una clase cada una -- asi
   que decide el orden del archivo, y la insignia va despues. Sin esto, un
   `class="mensaje aviso"` salia en MAYUSCULAS a 10px y el aviso del validador
   se leia como un grito.
   El arreglo de fondo es renombrar la insignia; esta definida en diez
   plantillas y usada en dos sitios de _nav.html. */
.mensaje.aviso{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);
  font-size:13.5px;text-transform:none;letter-spacing:normal;
  font-family:inherit;padding:11px 15px;border-radius:5px}

.aviso{text-decoration:none;font-family:"JetBrains Mono",monospace;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;background:var(--ac-soft);color:var(--ac);
  padding:3px 7px;border-radius:3px;white-space:nowrap}
.aviso.urg{background:var(--urg-soft);color:var(--urg)}
.tarjeta{background:var(--panel);border:1px solid var(--line);border-radius:5px;
  padding:20px 22px;margin-bottom:18px}
.tarjeta h2{font-family:Sora,sans-serif;font-size:1.05rem;font-weight:600;margin:0 0 4px;
  letter-spacing:-.01em}
.tarjeta .sub{font-size:12.5px;color:var(--ink-3);margin:0 0 18px;max-width:66ch}
/* ---------- PIE ----------
   Antes eran dos enlaces sueltos separados por un punto, pegados al borde y
   sin nada que los separase del contenido: se leia como algo a medio hacer.
   Ahora hay una linea de separacion, aire por encima, y las dos zonas
   (quienes somos / que puedes leer) a lados opuestos. */
.pie-app{
  max-width:1400px;margin:40px auto 0;padding:20px 22px 30px;
  border-top:1px solid var(--line-soft);
  font-size:12.5px;color:var(--ink-3);
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;
}
.pie-app .marca-pie{display:flex;align-items:center;gap:7px}
.pie-app .marca-pie .ico{width:14px;height:14px;color:var(--ink-3);flex:none}
.pie-app .enlaces{display:flex;gap:20px;flex-wrap:wrap}
/* Subrayado que aparece al pasar por encima en vez de estar siempre puesto:
   dos enlaces permanentemente subrayados en un pie ensucian mas de lo que
   ayudan, y siguen siendo obviamente enlaces por posicion y color. */
.pie-app a{color:var(--ink-3);text-decoration:none;border-bottom:1px solid transparent;
  transition:color .2s ease,border-color .2s ease}
.pie-app a:hover{color:var(--ac);border-bottom-color:var(--ac)}

/* ---------- utilidades ----------
   Existen para que la politica de seguridad pueda prohibir el estilo en linea.
   Mientras hubiera atributos style= habia que admitir 'unsafe-inline' en
   style-src, y con eso puesto la CSP no frena una inyeccion de CSS. Son pocas
   y con nombre literal a proposito: no es un sistema de utilidades, es la
   lista cerrada de lo que habia embebido. */
.mt-12{margin-top:12px}
.mt-14{margin-top:14px}
.mt-16{margin-top:16px}
.mt-18{margin-top:18px}
.pt-40{padding-top:40px}
.w-110{max-width:110px}
.w-120{max-width:120px}
.w-150{max-width:150px}
.w-160{max-width:160px}
.w-170{max-width:170px}
.w-180{max-width:180px}
.w-190{max-width:190px}
.w-250{max-width:250px}
.w-300{max-width:300px}
.w-380{max-width:380px}
.w-total{width:100%}
.w-total-alto{width:100%;padding:11px}
.w-auto{width:auto}
.en-linea{display:inline}
.fila-check{display:flex;align-items:center;gap:6px;font-size:13px}
.col-15{display:flex;flex-direction:column;gap:15px}
{% block estilos %}{% endblock %}
</style>
</head>
<body>
{% block cuerpo %}{% endblock %}
<footer class="pie-app">
  <span class="marca-pie">
    <svg class="ico" viewBox="0 0 32 32" aria-hidden="true">
      <g fill="currentColor">
        <g opacity=".35"><circle cx="6" cy="7" r="1.6"/><circle cx="7" cy="18" r="1.6"/><circle cx="15" cy="27" r="1.6"/></g>
        <circle cx="20" cy="16" r="4.2"/>
      </g>
      <circle cx="20" cy="16" r="7.8" fill="none" stroke="currentColor" stroke-width="1.8" opacity=".55"/>
    </svg>
    © 2026 LicitaPro Perú
  </span>
  <span class="enlaces">
    <a href="/terminos">Términos</a>
    <a href="/privacidad">Privacidad</a>
    <a href="/">Inicio</a>
  </span>
</footer>
<script src="/static/licitapro.js" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
