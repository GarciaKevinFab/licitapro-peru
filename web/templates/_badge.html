<!-- ==========================================================================
     Distintivo de constructor - "hecho por"
     ==========================================================================
     Se pega tal cual antes de </body>. No necesita nada mas: ni scripts, ni
     hojas externas, ni tipografias descargadas. El logo va incrustado como
     data URI, asi que la pastilla no genera NI UNA peticion.

     LAS DOS DECISIONES QUE NO SE TOCAN
     ----------------------------------
     z-index 29. Bajo a proposito. Si el sitio tiene un flotante propio -el
     boton de WhatsApp, un chat, un CTA- ese va por encima, y si aun asi
     estorba, este credito se muda al lado contrario con .sb-izquierda. Un
     credito nunca puede taparle la conversion al cliente.

     El punto verde es un acento de marca y NADA MAS. No pulsa, no dice "en
     linea" y no hay logica detras. Un punto verde que late afirma
     disponibilidad, y aqui no hay nada midiendo ninguna disponibilidad: seria
     mentir con un pixel.

     AISLAMIENTO
     -----------
     Todas las declaraciones llevan !important. En un componente normal seria
     un exceso; aqui es el punto: esto se pega en sitios ajenos cuyo CSS no
     controlamos, y un `a{text-decoration:underline!important}` del anfitrion
     -que los hay- desarmaria la pastilla sin el. Las variables --sb-* NO lo
     llevan, porque los temas funcionan redefiniendolas y blindarlas dejaria
     .sb-claro y .sb-oscuro sin efecto.

     Clases con prefijo sb- y variables propias del componente. Todo lo que se
     hereda -tipografia, interlineado, espaciado entre letras, decoracion de
     texto, transformacion, direccion- se fija a mano, porque un
     a{text-decoration:underline} o un body{letter-spacing:.05em} del sitio
     anfitrion se colarian dentro. Tampoco se usan <b> ni <em>: si el sitio los
     redefine, aqui no hay ninguno al que afectar.
========================================================================== -->
<style nonce="{{ request.state.csp_nonce }}">
.sb-credito {
  /* Fichas propias. El componente no lee ninguna variable del sitio, asi que
     un --color o un --radius del anfitrion no puede alterarlo. */
  --sb-fondo: rgba(255,255,255,.92);
  --sb-borde: rgba(2,6,23,.10);
  --sb-tinta: #0f172a;
  --sb-tenue: rgba(15,23,42,.58);
  --sb-punto: #22c55e;
  --sb-sombra: 0 1px 2px rgba(2,6,23,.06), 0 4px 12px rgba(2,6,23,.08);

  position: fixed !important;
  right: 1rem !important;
  bottom: 1rem !important;
  z-index: 29 !important;                 /* ver cabecera: bajo a proposito */

  display: inline-flex !important;
  align-items: center !important;
  gap: .5rem !important;
  box-sizing: border-box !important;
  margin: 0 !important;
  padding: .35rem .6rem !important;
  border: 1px solid var(--sb-borde) !important;
  border-radius: .7rem !important;
  background: var(--sb-fondo) !important;
  box-shadow: var(--sb-sombra) !important;
  -webkit-backdrop-filter: blur(8px) !important;
  backdrop-filter: blur(8px) !important;

  /* Blindaje contra el CSS del anfitrion. */
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif !important;
  font-size: 1rem !important;
  font-style: normal !important;
  font-weight: 400 !important;
  font-variant: normal !important;
  line-height: 1.15 !important;
  letter-spacing: normal !important;
  word-spacing: normal !important;
  text-align: left !important;
  text-indent: 0 !important;
  text-transform: none !important;
  text-decoration: none !important;
  white-space: nowrap !important;
  direction: ltr !important;
  color: var(--sb-tinta) !important;
  -webkit-tap-highlight-color: transparent !important;

  /* Es un credito, no contenido: presente, pero apagado. */
  opacity: .62 !important;
  transition: opacity .18s ease !important;
}

/* Para cuando el flotante del sitio ya ocupa la esquina derecha. */
.sb-credito.sb-izquierda { right: auto !important; left: 1rem !important; }

.sb-credito:hover,
.sb-credito:focus-visible { opacity: 1 !important; }
.sb-credito:focus-visible { outline: 2px solid var(--sb-punto) !important; outline-offset: 2px !important; }

.sb-credito .sb-marca {
  display: block !important;
  height: 1.25rem !important;
  width: auto !important;        /* la marca es apaisada; forzarla a cuadrada la deforma */
  max-width: none !important;    /* muchos sitios llevan un img{max-width:100%} */
  min-width: 0 !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  flex: none !important;
}

.sb-credito .sb-texto {
  display: flex !important;
  flex-direction: column !important;
  gap: .05rem !important;
  min-width: 0 !important;
}

.sb-credito .sb-etiqueta {
  font-size: .5rem !important;
  font-weight: 600 !important;
  letter-spacing: .11em !important;
  text-transform: uppercase !important;
  line-height: 1.1 !important;
  color: var(--sb-tenue) !important;
}

.sb-credito .sb-nombre {
  font-size: .75rem !important;
  font-weight: 600 !important;
  font-style: normal !important;
  letter-spacing: normal !important;
  text-transform: none !important;
  line-height: 1.15 !important;
  color: var(--sb-tinta) !important;
}

.sb-credito .sb-punto {
  flex: none !important;
  width: .4rem !important;
  height: .4rem !important;
  border-radius: 50% !important;
  background: var(--sb-punto) !important;
  /* Sin animacion: es un acento, no un semaforo. */
}

/* --- Tema -----------------------------------------------------------------
   Por defecto sigue al sistema. En un sitio de tema FIJO eso falla: un
   visitante con el sistema en oscuro veria una pastilla oscura sobre una
   pagina clara. Para eso estan .sb-claro y .sb-oscuro, que mandan siempre. */
@media (prefers-color-scheme: dark) {
  .sb-credito:not(.sb-claro):not(.sb-oscuro) {
    --sb-fondo: rgba(15,23,42,.92);
    --sb-borde: rgba(255,255,255,.12);
    --sb-tinta: #f8fafc;
    --sb-tenue: rgba(248,250,252,.58);
    --sb-sombra: 0 1px 2px rgba(0,0,0,.40), 0 4px 14px rgba(0,0,0,.35);
  }
}

.sb-credito.sb-oscuro {
  --sb-fondo: rgba(15,23,42,.92);
  --sb-borde: rgba(255,255,255,.12);
  --sb-tinta: #f8fafc;
  --sb-tenue: rgba(248,250,252,.58);
  --sb-sombra: 0 1px 2px rgba(0,0,0,.40), 0 4px 14px rgba(0,0,0,.35);
}

.sb-credito.sb-claro {
  --sb-fondo: rgba(255,255,255,.92);
  --sb-borde: rgba(2,6,23,.10);
  --sb-tinta: #0f172a;
  --sb-tenue: rgba(15,23,42,.58);
  --sb-sombra: 0 1px 2px rgba(2,6,23,.06), 0 4px 12px rgba(2,6,23,.08);
}

/* ACTIVO en este sitio: ThemeContext pone/quita .dark en <html> y el usuario
   puede elegir claro con el sistema en oscuro. Manda el tema del SITIO, no el
   del sistema. Las dos reglas le ganan en especificidad al @media de arriba,
   en los dos sentidos. */

html.dark .sb-credito:not(.sb-claro):not(.sb-oscuro) {
  --sb-fondo: rgba(15,23,42,.92);
  --sb-borde: rgba(255,255,255,.12);
  --sb-tinta: #f8fafc;
  --sb-tenue: rgba(248,250,252,.58);
  --sb-sombra: 0 1px 2px rgba(0,0,0,.40), 0 4px 14px rgba(0,0,0,.35);
}
html:not(.dark) .sb-credito:not(.sb-claro):not(.sb-oscuro) {
  --sb-fondo: rgba(255,255,255,.92);
  --sb-borde: rgba(2,6,23,.10);
  --sb-tinta: #0f172a;
  --sb-tenue: rgba(15,23,42,.58);
  --sb-sombra: 0 1px 2px rgba(2,6,23,.06), 0 4px 12px rgba(2,6,23,.08);
}

/* --- Pantallas estrechas --------------------------------------------------
   Encogerlo no bastaba. Aun reducido medía ~180 px y, al ir fijo en la esquina
   inferior, seguia tapando el texto de la portada: en un movil de 375 px se
   comia tres palabras de cada linea que le tocara debajo.

   Se queda en el isotipo. La firma sigue estando -y los lectores de pantalla
   la leen igual, porque el aria-label del enlace la lleva entera-, pero ocupa
   lo que un boton y deja ver lo que hay detras. Es el mismo criterio que ya
   usa ZenStay en movil. */
@media (max-width: 30rem) {
  .sb-credito { right: .6rem !important; bottom: .6rem !important; padding: .35rem !important; gap: 0 !important; border-radius: .7rem !important; opacity: .82; }
  .sb-credito.sb-izquierda { left: .6rem !important; }
  .sb-credito .sb-marca { height: 1.15rem !important; }
  .sb-credito .sb-texto { display: none !important; }
  .sb-credito .sb-punto { display: none !important; }
}

@media (prefers-reduced-motion: reduce) {
  .sb-credito { transition: none !important; }
}

/* En papel no pinta nada. */
@media print { .sb-credito { display: none !important; } }
</style>
