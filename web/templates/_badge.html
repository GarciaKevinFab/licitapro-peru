<style nonce="{{ request.state.csp_nonce }}">
.sb-badge{
  /* Tema claro por defecto. */
  --sb-fondo:#ffffff;
  --sb-borde:#e3e0da;
  --sb-tinta:#14161a;
  --sb-tinta-2:#4a4f57;
  --sb-tinta-3:#8b9099;
  --sb-acento:#0054d4;
  --sb-punto:#0a6b45;
  --sb-sombra:0 1px 2px rgba(20,22,26,.05), 0 4px 12px rgba(20,22,26,.05);
  --sb-opacidad:.62;

  position:fixed; z-index:29;
  right:1rem;                      /* cambia a `left:1rem` si preferis */
  bottom:calc(1rem + env(safe-area-inset-bottom));
  display:inline-flex; align-items:center; gap:.5rem;
  padding:.35rem .6rem;
  border:1px solid var(--sb-borde); border-radius:.7rem;
  background:var(--sb-fondo);
  box-shadow:var(--sb-sombra);
  text-decoration:none;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  opacity:var(--sb-opacidad);
  transition:opacity .2s ease, transform .2s ease, border-color .2s ease;
}
.sb-badge:hover{opacity:1; transform:translateY(-1px); border-color:var(--sb-acento)}

.sb-logo{height:1.25rem; width:auto; display:block; flex-shrink:0}
.sb-txt{display:block; line-height:1}
.sb-badge em{display:block; font-style:normal; font-size:.5rem; line-height:1.2;
  letter-spacing:.11em; text-transform:uppercase; color:var(--sb-tinta-3)}
.sb-badge b{display:block; font-size:.75rem; font-weight:600; line-height:1.25;
  margin-top:.05rem; letter-spacing:-.005em; color:var(--sb-tinta-2);
  white-space:nowrap}
.sb-badge:hover b{color:var(--sb-tinta)}
.sb-dot{width:.5rem; height:.5rem; margin-left:.2rem; border-radius:50%;
  background:var(--sb-punto); flex-shrink:0; text-decoration:none}

/* Paleta oscura: por preferencia del sistema, salvo que el sitio la bloquee
   con `.sb-claro`. */
@media (prefers-color-scheme:dark){
  .sb-badge:not(.sb-claro){
    --sb-fondo:#14171d; --sb-borde:#232830;
    --sb-tinta:#f0f1f3; --sb-tinta-2:#a4abb6; --sb-tinta-3:#6b727e;
    --sb-acento:#5b9bff; --sb-punto:#3ddc97;
    --sb-sombra:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  }
}
/* Forzada a mano, para sitios con tema fijo. */
.sb-badge.sb-oscuro{
  --sb-fondo:#14171d; --sb-borde:#232830;
  --sb-tinta:#f0f1f3; --sb-tinta-2:#a4abb6; --sb-tinta-3:#6b727e;
  --sb-acento:#5b9bff; --sb-punto:#3ddc97;
  --sb-sombra:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
}

/* En pantallas angostas se achica: sobre 375 px de ancho, una pastilla de
   220 px se come la pantalla y tapa el contenido del cliente.

   Achicarla no bastaba. Aun reducida medía ~180 px y, al ir fija en la esquina
   inferior, seguia tapando: en la portada se comia la linea "14 dias de plan
   Pro. Sin tarjeta.", que es justo la letra pequena que resuelve la duda de
   quien esta a punto de registrarse.

   Se queda en el isotipo. La firma sigue estando -y los lectores de pantalla
   la leen igual, porque el aria-label del enlace la lleva entera-, pero ocupa
   lo que un boton y deja ver lo que hay detras. */
@media (max-width:30rem){
  .sb-badge{padding:.35rem; gap:0; border-radius:.7rem; opacity:.82}
  .sb-badge .sb-txt{display:none}
  .sb-logo{height:1.15rem}
  .sb-dot{display:none}
}

/* Respeta a quien pidio menos movimiento. */
@media (prefers-reduced-motion:reduce){
  .sb-badge{transition:none}
  .sb-badge:hover{transform:none}
}

/* --- LICITAPRO: el panel deja forzar el tema con data-theme en <html> ---
   El badge ya sigue a prefers-color-scheme, pero eso no basta aqui: quien
   tenga el sistema en oscuro y elija tema claro en el panel veria una pastilla
   oscura sobre pagina clara. Es el mismo fallo que el badge advierte para
   sitios de tema fijo, solo que provocado por la preferencia del usuario. */
:root[data-theme="dark"] .sb-badge{
  --sb-fondo:#14171d; --sb-borde:#232830;
  --sb-tinta:#f0f1f3; --sb-tinta-2:#a4abb6; --sb-tinta-3:#6b727e;
  --sb-acento:#5b9bff; --sb-punto:#3ddc97;
  --sb-sombra:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
}
:root[data-theme="light"] .sb-badge{
  --sb-fondo:#ffffff; --sb-borde:#e3e0da;
  --sb-tinta:#14161a; --sb-tinta-2:#4a4f57; --sb-tinta-3:#8b9099;
  --sb-acento:#0054d4; --sb-punto:#0a6b45;
  --sb-sombra:0 1px 2px rgba(20,22,26,.05), 0 4px 12px rgba(20,22,26,.05);
}
</style>
