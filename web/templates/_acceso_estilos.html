/* ============================================================================
   ACCESO — la concha compartida de /entrar, /registro y /recuperar

   Se incluye dentro del <style nonce> de cada plantilla (block estilos), asi
   que todo esto viaja con el nonce y la CSP no tiene que admitir nada mas.

   SOLO COMPOSICION. Antes este bloque redefinia los tokens (--bg, --ac, las
   tintas) y traia tres familias de Google Fonts: el acceso era una tercera
   identidad entre la portada y el panel. Ahora todo sale de licitapro.css
   -- campos, botones, mensajes, tarjeta, rotulos -- y aqui solo queda lo que
   no existe dentro de la app: las dos columnas y el panel de marca.

   EL PATRON
     Pantalla partida 50/50 en escritorio: a la izquierda el panel de marca
     (trama de puntos, resplandor menta, titular en Fraunces, tres argumentos,
     pie legal); a la derecha la tarjeta con el formulario. En el telefono solo
     queda la tarjeta, con la marca encima y el pie legal debajo.
   ========================================================================== */
/* El pie comun de la base sobra aqui: el panel de marca lleva el suyo, y en el
   telefono lo lleva la columna del formulario. Queda en el DOM (la
   titularidad sigue saliendo una vez), solo no se pinta. */
.pie-app{display:none}

.acceso{min-height:100svh;display:grid;grid-template-columns:1fr}
@media (min-width:1024px){ .acceso{grid-template-columns:1fr 1fr} }

/* ---------- PANEL DE MARCA (izquierda) ---------- */
.pm{display:none;position:relative;overflow:hidden;isolation:isolate;flex-direction:column;justify-content:space-between;gap:40px;
  padding:clamp(32px,4vw,56px);border-right:1px solid var(--line-soft);
  background:linear-gradient(160deg,var(--bg) 0%,var(--bg-2) 50%,color-mix(in srgb,var(--bg-2) 82%,var(--ac-3)) 100%)}
@media (min-width:1024px){ .pm{display:flex} }
/* Trama de puntos: un punto de 1 px cada 24. Es lo que hace que el negro no
   se lea plano, y cuesta cero peticiones. */
.pm::before{content:"";position:absolute;inset:0;z-index:-2;opacity:.08;pointer-events:none;
  background-image:radial-gradient(circle at 1px 1px,var(--ink) 1px,transparent 0);background-size:24px 24px}
/* Resplandores menta en esquinas opuestas, flotando muy despacio. */
.pm-glow{position:absolute;z-index:-1;border-radius:50%;pointer-events:none;filter:blur(70px);background:var(--ac)}
.pm-glow.a{width:460px;height:460px;top:-180px;right:-170px;opacity:.13;animation:pmFlota 14s ease-in-out infinite}
.pm-glow.b{width:400px;height:400px;bottom:-190px;left:-120px;opacity:.08;animation:pmFlota 18s ease-in-out infinite reverse}
@keyframes pmFlota{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-18px,22px,0)}}
/* El radar de la marca, enorme y casi invisible, girando: la unica forma que
   no es un adorno generico, porque es el logotipo. */
.pm-radar{position:absolute;z-index:-1;right:-6%;top:24%;width:min(46vw,520px);height:auto;color:var(--ac);opacity:.07;pointer-events:none;
  animation:pmGira 90s linear infinite}
@keyframes pmGira{to{transform:rotate(360deg)}}
.pm-dot{position:absolute;z-index:-1;border-radius:50%;background:var(--ac);pointer-events:none;animation:pmSube 7s ease-in-out infinite}
.pm-dot.d1{width:6px;height:6px;left:12%;top:30%;opacity:.55}
.pm-dot.d2{width:4px;height:4px;left:24%;top:62%;opacity:.4;animation-delay:1.4s}
.pm-dot.d3{width:8px;height:8px;left:46%;top:78%;opacity:.3;animation-delay:2.8s}
.pm-dot.d4{width:4px;height:4px;left:60%;top:22%;opacity:.45;animation-delay:.7s}
@keyframes pmSube{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

/* La marca, con la misma voz que en la barra lateral del panel. */
.pm-marca,.marca-m .logo{display:inline-flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:600;font-size:18px;
  letter-spacing:-.02em;font-variation-settings:"opsz" 48;color:var(--ink);text-decoration:none;min-height:44px}
.pm-marca{align-self:flex-start}
.pm-marca .ico,.marca-m .ico{width:22px;height:22px;color:var(--ac);flex:none;filter:drop-shadow(0 0 10px var(--ac-glow))}
.pm-marca .pe,.marca-m .pe{color:var(--ink-3);font-weight:400;font-style:italic}

.pm-cuerpo{max-width:34rem}
.pm-kicker{display:flex;align-items:center;gap:12px;margin:0 0 22px}
.pm-kicker::before{content:"";width:30px;height:1px;background:var(--ac);opacity:.6}
.pm h2{font-family:var(--f-display);font-weight:600;font-size:clamp(2.4rem,3.6vw,3.5rem);line-height:1;letter-spacing:-.028em;
  font-variation-settings:"opsz" 144,"SOFT" 30;color:var(--ink)}
.pm h2 .menta{color:var(--ac);font-style:italic;font-weight:500}
.pm-texto{margin:22px 0 0;max-width:46ch;font-size:16px;line-height:1.55;color:var(--ink-2)}
.pm-puntos{list-style:none;margin:26px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.pm-puntos li{display:flex;align-items:flex-start;gap:12px;font-size:14.5px;color:var(--ink-2);line-height:1.45}
.pm-puntos svg{width:18px;height:18px;flex:none;color:var(--ac);margin-top:2px}
.pm-pie{font-size:12.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:0}
.pm-pie a{color:var(--ink-3);text-decoration:none;border-bottom:1px solid transparent;min-height:44px;display:inline-flex;align-items:center}
.pm-pie a:hover{color:var(--ac);border-bottom-color:var(--ac)}

/* ---------- COLUMNA DEL FORMULARIO (derecha) ---------- */
.lf{position:relative;display:flex;align-items:center;justify-content:center;padding:clamp(20px,4vw,48px) clamp(16px,4vw,48px)}
.caja{position:relative;z-index:1;width:100%;max-width:440px}

/* Marca y linea de arriba, solo en el telefono. */
.marca-m{display:flex;flex-direction:column;align-items:center;gap:4px;margin:6px 0 24px;text-decoration:none;color:var(--ink);text-align:center}
@media (min-width:1024px){ .marca-m{display:none} }

/* La tarjeta es la .tarjeta del sistema; aqui solo el titular editorial y
   que el boton principal ocupe el ancho. */
.tarjeta-acc{margin-bottom:0;box-shadow:var(--sombra-2)}
.tarjeta-acc h1{font-family:var(--f-display);font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:0 0 6px;
  font-variation-settings:"opsz" 72,"SOFT" 20}
.tarjeta-acc .lead{margin:0 0 22px;font-size:14px;color:var(--ink-3)}
.tarjeta-acc .lead b{color:var(--ink-2);font-weight:500}
form.acc{display:flex;flex-direction:column;gap:16px}
form.acc .mensaje{margin:0}
.tarjeta-acc input[type=text],.tarjeta-acc input[type=email],.tarjeta-acc input[type=password]{min-height:46px;font-size:15px}
.tarjeta-acc button[type=submit],.tarjeta-acc .btn{width:100%;min-height:46px;font-size:15px;margin-top:4px}

.olvide{margin:2px 0 0;text-align:center;font-size:13.5px}
.alterna{margin:22px 0 0;text-align:center;font-size:14px;color:var(--ink-3)}
.alterna + .alterna{margin-top:8px}
.olvide a,.alterna a,.legal a{color:var(--ink-2);text-decoration:underline;text-underline-offset:4px;
  text-decoration-color:color-mix(in srgb,var(--ink-3) 55%,transparent);transition:color var(--dur) ease}
.olvide a:hover,.alterna a:hover,.legal a:hover{color:var(--ac)}
.alterna a.fuerte{color:var(--ac);font-weight:600;text-decoration-color:color-mix(in srgb,var(--ac) 45%,transparent)}
.alterna a,.olvide a{display:inline-flex;align-items:center;min-height:32px}
.legal{font-size:12px;color:var(--ink-3);line-height:1.55;margin:0;text-align:center}
.volver .fl{display:inline-block;margin-right:6px;transition:transform .25s var(--ease-out)}
.volver:hover .fl{transform:translateX(-3px)}
.pie-m{margin:28px 0 0;text-align:center;font-size:12px;color:var(--ink-3)}
.pie-m a{color:var(--ink-3);text-decoration:underline;text-underline-offset:4px}
.pie-m a:hover{color:var(--ac)}
@media (min-width:1024px){ .pie-m{display:none} }
/* Marca de "hecho": circulo del color de exito con la palomita en SVG. */
.icono-ok{width:48px;height:48px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 0 16px}
.icono-ok svg{width:22px;height:22px}

/* ---------- entrada ----------
   Animacion CSS, no clase desde JS: si el script falla, un formulario de
   acceso invisible deja a la persona fuera de su cuenta. */
@keyframes accEntra{from{opacity:0;transform:translate3d(0,16px,0)}to{opacity:1;transform:none}}
@keyframes accLogo{from{opacity:0;transform:translate3d(0,-10px,0) scale(.96)}to{opacity:1;transform:none}}
.pm-marca,.marca-m{animation:accLogo .45s var(--ease-out) backwards}
.pm-cuerpo,.tarjeta-acc{animation:accEntra .5s var(--ease-out) .12s backwards}
.pm-pie,.alterna,.pie-m{animation:accEntra .5s var(--ease-out) .22s backwards}
@media (prefers-reduced-motion:reduce){
  .pm-marca,.marca-m,.pm-cuerpo,.tarjeta-acc,.pm-pie,.alterna,.pie-m,.pm-glow,.pm-radar,.pm-dot{animation:none}
  .volver:hover .fl{transform:none}
}
