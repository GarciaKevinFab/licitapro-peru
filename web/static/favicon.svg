<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Favicon: la misma marca, pero con el verde fijo y el ruido mas marcado.
       A 16px el currentColor no sirve (la pestana no da contexto de color) y
       el opacity .28 del ruido desaparece del todo. -->
  <rect width="32" height="32" rx="7" fill="#06080B"/>
  <g fill="#34E0B4">
    <g opacity=".45">
      <circle cx="7"  cy="8"  r="1.3"/>
      <circle cx="14" cy="6"  r="1.3"/>
      <circle cx="7"  cy="17" r="1.3"/>
      <circle cx="9"  cy="25" r="1.3"/>
      <circle cx="17" cy="26" r="1.3"/>
    </g>
    <circle cx="20" cy="16" r="4"/>
  </g>
  <circle cx="20" cy="16" r="7.4" fill="none" stroke="#34E0B4" stroke-width="1.7" opacity=".6"/>
</svg>
