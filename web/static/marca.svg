<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="LicitaPro">
  <!--
    MARCA LICITAPRO - una senal que destaca entre el ruido.

    El producto es exactamente eso: el Estado publica cientos de convocatorias
    al dia y nosotros senalamos la tuya. Por eso el icono son puntos tenues
    (el ruido) y uno solido con su anillo (la senal). Ni lupa ni balanza, que
    es donde acaba todo el mundo y no dice nada.

    POR QUE SE DIBUJA EN 32x32 Y NO EN 512

      Se disena en la reja que peor lo va a pasar. Un icono hecho a 512 y
      reducido a 16 se convierte en una mancha gris; al reves funciona en los
      dos tamanos. Los centros caen en coordenadas enteras para que el pixel
      no quede a medias y se vea borroso.

    currentColor a proposito: el mismo archivo sirve de favicon, en la cabecera
    clara y en la oscura, heredando el color de donde se ponga. Un solo archivo
    que mantener en vez de tres que se desincronizan.
  -->
  <g fill="currentColor">
    <g opacity=".28">
      <circle cx="6"  cy="7"  r="1.35"/>
      <circle cx="14" cy="5"  r="1.35"/>
      <circle cx="25" cy="8"  r="1.35"/>
      <circle cx="6"  cy="17" r="1.35"/>
      <circle cx="7"  cy="26" r="1.35"/>
      <circle cx="16" cy="27" r="1.35"/>
      <circle cx="26" cy="24" r="1.35"/>
    </g>
    <circle cx="20" cy="16" r="4.1"/>
  </g>
  <circle cx="20" cy="16" r="7.6" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".55"/>
</svg>
