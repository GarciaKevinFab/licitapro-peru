# Despliegue de produccion. Ningun secreto vive aqui: todos salen del .env, que
# no se commitea. El compose de desarrollo tenia las contrasenas escritas
# dentro, y eso es justo lo que no puede subir a un servidor.
#
#   cp .env.example .env  &&  editar .env
#   docker compose -f docker-compose.prod.yml up -d --build
#
# LA BASE ES SUPABASE, y viene entera en DATABASE_URL. Por eso aqui NO hay
# servicio postgres: en produccion el dato vive fuera del servidor, con sus
# copias gestionadas, y no en un volumen que se va con el VPS.
#
# El Postgres local sigue estando en docker-compose.yml, que es el de
# desarrollo. Alli si conviene: cada uno con su base, sin tocar la de nadie.

# AQUI HABIA UN REDIS Y NO LO USABA NADIE
#
#   Estuvo levantado desde el primer despliegue. Al revisarlo el 2026-09-03:
#   cero claves, el unico cliente conectado era el redis-cli con el que se
#   estaba mirando, y ningun servicio lo declaraba en `depends_on`. En el
#   codigo, cero `import redis` y cero `REDIS_URL` -- la dependencia estaba en
#   requirements.txt y nada la importaba.
#
#   Se quita el servicio y su volumen. Un contenedor que nadie usa no es solo
#   3 MB de RAM en un VPS de dos nucleos con otros tres proyectos: es una pieza
#   mas que parece parte del sistema, que alguien tendra que entender antes de
#   tocar nada, y que hace creer que hay una cache donde no la hay.
#
#   Si algun dia hace falta -- por ejemplo para mover ahi el contador de
#   web/limites.py cuando se levante mas de un worker de uvicorn --, se vuelve
#   a anadir junto con el codigo que lo use, en el mismo cambio.

# ── Con que rol entra la aplicacion a la base ─────────────────────────────
#
#   web, radar, prep y win entran como `licitapro_app`, que NO es superusuario:
#   solo lee y escribe filas (tools/crear_rol_app.sql). `licitapro`, el
#   superusuario que crea la imagen de postgres y dueno de las tablas, queda
#   para `migraciones` y para tools/respaldar.sh, que siguen leyendo la
#   DATABASE_URL del .env.
#
#   POR QUE: con un superusuario, cualquier fallo que deje ejecutar SQL desde
#   la app (una inyeccion) ejecuta tambien comandos en el contenedor
#   (`COPY ... TO PROGRAM`) y lee archivos del servidor. Con este rol se queda
#   en las filas de LicitaPro.
#
#   Se pisa DATABASE_URL y no solo POSTGRES_USER porque en el .env de
#   produccion DATABASE_URL esta puesta, y manda sobre las piezas sueltas
#   (shared/db.py). Las piezas se fijan igual, para que nada que las lea por
#   su cuenta vuelva a entrar como superusuario.
#
#   PG_APP_PASSWORD va en el .env, SOLO con letras y numeros (viaja dentro de
#   la URL: un @ o un / sin codificar la parte por otro sitio). Sin `:?`, como
#   PG_VPS_PASSWORD: compose interpola todos los servicios y exigirla aqui
#   impediria hasta correr las migraciones. Vacia, la app no entra a la base y
#   lo dice en el log al arrancar. Pasos completos: DESPLIEGUE.md, "Rol de la
#   aplicacion sin superusuario".
x-bd-app: &bd-app
  DATABASE_URL: postgresql://licitapro_app:${PG_APP_PASSWORD:-}@postgres:5432/licitapro
  POSTGRES_USER: licitapro_app
  POSTGRES_PASSWORD: ${PG_APP_PASSWORD:-}

services:
  # ── La base, en el mismo servidor ─────────────────────────────────────
  #
  #   Supabase quedaba a ~50 ms por consulta (VPS en Boston, base en Ohio,
  #   pasando por su pooler con TLS), y una pagina hace decenas. Aqui la ida
  #   y vuelta es de microsegundos.
  #
  #   Los servicios la ven por la red interna (host `postgres`). Hacia fuera
  #   solo se publica en el loopback del host, para el tunel SSH de la PC
  #   puente: una base abierta a internet es una base que alguien va a probar.
  #
  #   La sesion va en UTC (`-c timezone=UTC` y POSTGRES_ZONA_SESION=UTC en el
  #   .env), igual que estuvo siempre en Supabase: su pooler ignoraba la zona
  #   que pedia el pool. Lo guardado con NOW() durante meses esta en UTC, y
  #   cambiar de zona al mudarse correria cinco horas todo lo nuevo.
  #
  #   Respaldo: tools/respaldar.sh, cada 6 horas desde el cron del host, con
  #   copia fuera del servidor (R2). Restaurar: ver tools/migrar_a_vps.sh.
  postgres:
    image: postgres:17-alpine   # misma version mayor que Supabase (17.6)
    restart: unless-stopped
    environment:
      POSTGRES_DB: licitapro
      POSTGRES_USER: licitapro
      # Sin `:?`: compose interpola todos los servicios y exigirla aqui
      # impediria levantar el resto. Vacia, la imagen se niega a inicializar,
      # que es el sitio correcto para protestar.
      POSTGRES_PASSWORD: ${PG_VPS_PASSWORD:-}
    command: >
      postgres
      -c timezone=UTC
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c max_connections=60
      -c log_min_duration_statement=500
    # Solo el loopback del host, y en el 5442 (el 5432 es de otro proyecto):
    # por ahi entra el tunel SSH de la PC puente (tools/tunel_puente.py).
    # Desde internet no se ve.
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U licitapro -d licitapro"]
      interval: 5s
      timeout: 5s
      retries: 12

  migraciones:
    build: .
    command: alembic upgrade head
    # Con `licitapro` (la DATABASE_URL del .env): crear y alterar tablas es
    # cosa del dueno. Lo que cree, licitapro_app lo ve por los ALTER DEFAULT
    # PRIVILEGES de tools/crear_rol_app.sql.
    env_file: .env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    # RESOLUTOR PROPIO, Y NO POR CAPRICHO
    #
    #   El VPS resuelve por el DNS de Hostinger (153.92.2.6), y ese servidor
    #   sirvio durante horas la cadena ANTIGUA de mail.sisac.pe: el CNAME que
    #   ya se habia borrado y las IPs de Cloudflare que van con el. Comparado
    #   el mismo dia:
    #
    #     @1.1.1.1     -> 185.73.9.4                  (correcto)
    #     @153.92.2.6  -> 104.21.40.60, 172.67.178.9  (obsoleto)
    #
    #   Con eso, el envio de correo fallaba con "Timed out connecting to
    #   mail.sisac.pe": la aplicacion hablaba con el proxy de Cloudflare, que
    #   no entiende SMTP. Vaciar la cache local no arregla nada, porque el
    #   dato equivocado viene de arriba.
    #
    #   Un fallo de DNS del proveedor no puede tumbar el correo del producto,
    #   asi que los contenedores preguntan por su cuenta.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *bd-app
      LICITAPRO_ENTORNO: produccion
    ports:
      - "127.0.0.1:8200:8200"   # detras de un proxy con TLS, nunca expuesto directo
    depends_on:
      migraciones:
        condition: service_completed_successfully
    volumes:
      - datos_expedientes:/app/data

  radar:
    # RESOLUTOR PROPIO, Y NO POR CAPRICHO
    #
    #   El VPS resuelve por el DNS de Hostinger (153.92.2.6), y ese servidor
    #   sirvio durante horas la cadena ANTIGUA de mail.sisac.pe: el CNAME que
    #   ya se habia borrado y las IPs de Cloudflare que van con el. Comparado
    #   el mismo dia:
    #
    #     @1.1.1.1     -> 185.73.9.4                  (correcto)
    #     @153.92.2.6  -> 104.21.40.60, 172.67.178.9  (obsoleto)
    #
    #   Con eso, el envio de correo fallaba con "Timed out connecting to
    #   mail.sisac.pe": la aplicacion hablaba con el proxy de Cloudflare, que
    #   no entiende SMTP. Vaciar la cache local no arregla nada, porque el
    #   dato equivocado viene de arriba.
    #
    #   Un fallo de DNS del proveedor no puede tumbar el correo del producto,
    #   asi que los contenedores preguntan por su cuenta.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    build: .
    command: python -m radar_bot.main
    # El HEALTHCHECK vive en el Dockerfile y hace `curl localhost:8200/salud`.
    # Los bots no sirven HTTP: heredarlo los deja `unhealthy` para siempre, y
    # un indicador que esta siempre en rojo es peor que no tenerlo, porque
    # ensena a no mirarlo -- y entonces no sirve el dia que tiene razon.
    healthcheck:
      disable: true
    restart: unless-stopped
    env_file: .env
    environment: *bd-app
    depends_on:
      migraciones:
        condition: service_completed_successfully

  prep:
    # RESOLUTOR PROPIO, Y NO POR CAPRICHO
    #
    #   El VPS resuelve por el DNS de Hostinger (153.92.2.6), y ese servidor
    #   sirvio durante horas la cadena ANTIGUA de mail.sisac.pe: el CNAME que
    #   ya se habia borrado y las IPs de Cloudflare que van con el. Comparado
    #   el mismo dia:
    #
    #     @1.1.1.1     -> 185.73.9.4                  (correcto)
    #     @153.92.2.6  -> 104.21.40.60, 172.67.178.9  (obsoleto)
    #
    #   Con eso, el envio de correo fallaba con "Timed out connecting to
    #   mail.sisac.pe": la aplicacion hablaba con el proxy de Cloudflare, que
    #   no entiende SMTP. Vaciar la cache local no arregla nada, porque el
    #   dato equivocado viene de arriba.
    #
    #   Un fallo de DNS del proveedor no puede tumbar el correo del producto,
    #   asi que los contenedores preguntan por su cuenta.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    build: .
    command: python -m prep_bot.main
    # El HEALTHCHECK vive en el Dockerfile y hace `curl localhost:8200/salud`.
    # Los bots no sirven HTTP: heredarlo los deja `unhealthy` para siempre, y
    # un indicador que esta siempre en rojo es peor que no tenerlo, porque
    # ensena a no mirarlo -- y entonces no sirve el dia que tiene razon.
    healthcheck:
      disable: true
    restart: unless-stopped
    env_file: .env
    environment: *bd-app
    depends_on:
      migraciones:
        condition: service_completed_successfully
    volumes:
      - datos_expedientes:/app/data

  win:
    # RESOLUTOR PROPIO, Y NO POR CAPRICHO
    #
    #   El VPS resuelve por el DNS de Hostinger (153.92.2.6), y ese servidor
    #   sirvio durante horas la cadena ANTIGUA de mail.sisac.pe: el CNAME que
    #   ya se habia borrado y las IPs de Cloudflare que van con el. Comparado
    #   el mismo dia:
    #
    #     @1.1.1.1     -> 185.73.9.4                  (correcto)
    #     @153.92.2.6  -> 104.21.40.60, 172.67.178.9  (obsoleto)
    #
    #   Con eso, el envio de correo fallaba con "Timed out connecting to
    #   mail.sisac.pe": la aplicacion hablaba con el proxy de Cloudflare, que
    #   no entiende SMTP. Vaciar la cache local no arregla nada, porque el
    #   dato equivocado viene de arriba.
    #
    #   Un fallo de DNS del proveedor no puede tumbar el correo del producto,
    #   asi que los contenedores preguntan por su cuenta.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    build: .
    command: python -m win_bot.main
    # El HEALTHCHECK vive en el Dockerfile y hace `curl localhost:8200/salud`.
    # Los bots no sirven HTTP: heredarlo los deja `unhealthy` para siempre, y
    # un indicador que esta siempre en rojo es peor que no tenerlo, porque
    # ensena a no mirarlo -- y entonces no sirve el dia que tiene razon.
    healthcheck:
      disable: true
    restart: unless-stopped
    env_file: .env
    environment: *bd-app
    depends_on:
      migraciones:
        condition: service_completed_successfully
    volumes:
      # win_bot mete el logo, la firma y el sello en las facturas que genera
      # (invoice_gen.py llama a obtener_firma). Sin este volumen la ruta que
      # lee de la base apunta a un archivo que en ESTE contenedor no existe, y
      # los documentos salen sin las imagenes -- en silencio, porque el
      # generador se limita a saltarse la que no encuentra.
      - datos_expedientes:/app/data

  # ── Como se llega al panel desde internet: elige UNO ──────────────────
  #
  #   --profile tunnel   Cloudflare Tunnel. Es el camino recomendado y el que
  #                      ya corre en VueloRadar. Sin puertos entrantes, sin
  #                      certificados que renovar, y la IP del VPS no queda
  #                      expuesta. Un mismo tunel sirve varios proyectos.
  #
  #   --profile proxy    Caddy con Let's Encrypt. Para desplegar sin
  #                      Cloudflare, o para probar el stack sin tocar la cuenta.
  #
  # Van en perfiles distintos porque los dos quieren ser la puerta de entrada:
  # levantarlos juntos deja a Caddy peleando por el 443 contra un tunel que ya
  # esta sirviendo el mismo dominio.

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # --no-autoupdate: que la version la decida un despliegue, no el
    # contenedor a las tres de la manana.
    command: tunnel --no-autoupdate run
    environment:
      # Sin `:?` a proposito. Compose interpola TODOS los servicios aunque el
      # perfil no este activo, asi que exigirla aqui impedia arrancar el stack
      # normal a quien -- como este VPS -- corre cloudflared en el host y por
      # tanto nunca define esta variable. Si el perfil se usa vacia, cloudflared
      # protesta al arrancar, que es donde corresponde.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web
    profiles: ["tunnel"]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      LICITAPRO_DOMINIO: ${LICITAPRO_DOMINIO:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Los certificados van en un volumen: sin el, cada reinicio pediria uno
      # nuevo y Let's Encrypt limita cuantos se emiten por semana. Ese limite
      # se agota rapido y deja el sitio sin TLS hasta que pase la ventana.
      - caddy_datos:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  # `datos_redis` se fue con el servicio que lo montaba. Estaba vacio.
  datos_expedientes:
  # La base de LicitaPro. Borrar este volumen es borrar los datos de los
  # clientes: el respaldo existe, pero es de hace hasta seis horas.
  datos_postgres:
  caddy_datos:
  caddy_config:
