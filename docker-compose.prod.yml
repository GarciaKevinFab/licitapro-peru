# Despliegue de produccion. Ningun secreto vive aqui: todos salen del .env, que
# no se commitea. El compose de desarrollo tenia las contrasenas escritas
# dentro, y eso es justo lo que no puede subir a un servidor.
#
#   cp .env.example .env  &&  editar .env
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
      TZ: America/Lima
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    # Sin puertos publicados: solo se llega desde la red interna de compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - datos_redis:/data

  migraciones:
    build: .
    command: alembic upgrade head
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      LICITAPRO_ENTORNO: produccion
    ports:
      - "127.0.0.1:8200:8200"   # detras de un proxy con TLS, nunca expuesto directo
    depends_on:
      postgres:
        condition: service_healthy
      migraciones:
        condition: service_completed_successfully
    volumes:
      - datos_expedientes:/app/data

  radar:
    build: .
    command: python -m radar_bot.main
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      migraciones:
        condition: service_completed_successfully

  prep:
    build: .
    command: python -m prep_bot.main
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      migraciones:
        condition: service_completed_successfully
    volumes:
      - datos_expedientes:/app/data

  win:
    build: .
    command: python -m win_bot.main
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      migraciones:
        condition: service_completed_successfully
    volumes:
      # win_bot mete el logo, la firma y el sello en las facturas que genera
      # (invoice_gen.py llama a obtener_firma). Sin este volumen la ruta que
      # lee de la base apunta a un archivo que en ESTE contenedor no existe, y
      # los documentos salen sin las imagenes -- en silencio, porque el
      # generador se limita a saltarse la que no encuentra.
      - datos_expedientes:/app/data

  # El proxy que termina TLS. Es lo unico que asoma a internet: todo lo demas
  # vive en la red interna de compose.
  #
  # Caddy pide y renueva el certificado de Let's Encrypt por su cuenta. Para
  # que funcione, el dominio de LICITAPRO_DOMINIO tiene que apuntar YA a la IP
  # de este servidor: la validacion se hace entrando desde fuera por el 80.
  # ── Como se llega al panel desde internet: elige UNO ──────────────────
  #
  #   --profile tunnel   Cloudflare Tunnel. Es el camino recomendado y el que
  #                      ya corre en VueloRadar. Sin puertos entrantes, sin
  #                      certificados que renovar, y la IP del VPS no queda
  #                      expuesta. Un mismo tunel sirve varios proyectos.
  #
  #   --profile proxy    Caddy con Let's Encrypt. Para desplegar sin
  #                      Cloudflare, o para probar el stack sin tocar la cuenta.
  #
  # Van en perfiles distintos porque los dos quieren ser la puerta de entrada:
  # levantarlos juntos deja a Caddy peleando por el 443 contra un tunel que ya
  # esta sirviendo el mismo dominio.

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # --no-autoupdate: que la version la decida un despliegue, no el
    # contenedor a las tres de la manana.
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?falta CLOUDFLARE_TUNNEL_TOKEN en .env}
    depends_on:
      - web
    profiles: ["tunnel"]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      LICITAPRO_DOMINIO: ${LICITAPRO_DOMINIO:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Los certificados van en un volumen: sin el, cada reinicio pediria uno
      # nuevo y Let's Encrypt limita cuantos se emiten por semana. Ese limite
      # se agota rapido y deja el sitio sin TLS hasta que pase la ventana.
      - caddy_datos:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  datos_postgres:
  datos_redis:
  datos_expedientes:
  caddy_datos:
  caddy_config:
